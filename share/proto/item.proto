syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 物品容器列表（路由 10500）
message ItemContainerListReq {
  ContainerType container_type = 1; // 物品容器类型（UNSPECIFIED 表示全部容器）
}

// 物品容器列表响应
message ItemContainerListResp {
  Result result = 1;
  repeated ItemContainer item_containers = 2; // 物品容器列表
}

// 物品容器内对象变化（路由 10501）
message ItemContainerNotify {
  ContainerType container_type = 1; // 物品容器类型
  ItemEntry item_entry = 2; // 物品容器内对象
}

// 物品容器内添加对象请求（路由 10502）
message ItemAddReq {
  ContainerType container_type = 1; // 物品容器类型
  ItemEntry item_entry = 2; // 对象实例
}

// 物品容器内添加对象响应
message ItemAddResp {
  Result result = 1;
}

// 物品容器内移动对象请求（路由 10503）
message ItemMoveReq {
  ContainerType container_type = 1; // 物品容器类型
  int64 id = 2;           // 对象实例ID
  int32 to_x = 3;         // 目标 X
  int32 to_y = 4;         // 目标 Y
  bool rotated = 5;       // 是否旋转放置
}

// 物品容器内移动对象响应
message ItemMoveResp {
  Result result = 1;
}

// 物品容器内旋转对象请求（路由 10504）
message ItemRotateReq {
  ContainerType container_type = 1; // 物品容器类型
  int64 id = 2;           // 对象实例ID
}

// 物品容器内旋转对象响应
message ItemRotateResp {
  Result result = 1;
}

// 物品容器一键整理请求（路由 10505）
message ItemSortReq {
  ContainerType container_type = 1; // 物品容器类型
}

// 物品容器一键整理响应
message ItemSortResp {
  Result result = 1;
}

// 物品容器间移动对象请求（路由 10506）
message ItemTransferReq {
  ContainerType from_type = 1; // 源物品容器类型
  ContainerType to_type = 2;   // 目标物品容器类型
  int64 id = 3;           // 对象实例ID
  int32 to_x = 4;         // 目标 X
  int32 to_y = 5;         // 目标 Y
  bool rotated = 6;       // 是否旋转放置
}

// 物品容器间移动对象响应
message ItemTransferResp {
  Result result = 1;
  ItemContainer from_container = 2; // 源物品容器（变更后）
  ItemContainer to_container = 3;   // 目标物品容器（变更后）
}

// 物品容器内清除对象请求（路由 10507）
message ItemClearReq {
  ContainerType container_type = 1; // 物品容器类型（UNSPECIFIED 表示全部容器）
  int64 id = 2;                     // 对象实例ID（0 表示清除范围内全部对象）
}

// 物品容器内清除对象响应
message ItemClearResp {
  Result result = 1;
  repeated ItemContainer item_containers = 2; // 变更后的物品容器列表
}
