syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 任务条目（玩家持有状态 + 配置展示字段）。
message TaskEntry {
  int32 task_id = 1;              // 任务ID（配置ID）
  int32 task_type = 2;            // 1主线 2日常 3周常 4活动 5全服
  int32 target_task_type = 3;     // 进度来源类型
  string period_key = 4;          // 周期key（main / 日期 / 周 / activity:实例ID）
  int64 progress = 5;             // 当前进度
  int64 target = 6;               // 目标进度
  int32 status = 7;               // 0未接取 1进行中 2可领取 3已领取
  int64 completed_at = 8;         // 完成时间（毫秒）
  int64 claimed_at = 9;           // 领奖时间（毫秒）
  string name = 10;               // 名称
  string desc = 11;               // 描述
  repeated AssetEntry rewards = 12; // 奖励资产
  int32 sort = 13;                // 排序
  int32 activity_cfg_id = 14;     // 归属活动模板
  int32 pre_task_id = 15;         // 前置任务ID
  int32 accept_type = 16;         // 1系统自动接取 2玩家手动接取
}

// 任务列表请求（路由 11200）。
message TaskListReq {
  int32 task_type = 1;       // 0=全部，按任务类型过滤
  int32 activity_cfg_id = 2; // 0=全部，按活动模板过滤
}

// 任务列表响应。
message TaskListResp {
  Result result = 1;
  repeated TaskEntry entries = 2; // 任务列表（按配置排序）
  int32 claimable_count = 3;      // 可领取数量（红点）
}

// 任务领奖请求（路由 11202）。
message TaskClaimReq {
  int32 task_id = 1; // 任务配置ID
}

// 任务领奖响应。
message TaskClaimResp {
  Result result = 1;
  TaskEntry entry = 2;               // 更新后的任务状态
  repeated AssetEntry rewards = 3;   // 实际发放奖励
}

// 任务接取请求（路由 11203，仅手动接取任务）。
message TaskAcceptReq {
  int32 task_id = 1; // 任务配置ID
}

// 任务接取响应。
message TaskAcceptResp {
  Result result = 1;
  TaskEntry entry = 2; // 更新后的任务状态（未接取→进行中）
}

// 任务进度/状态变化通知（路由 11201）。
message TaskNotify {
  repeated TaskEntry entries = 1; // 发生变化的任务
}
