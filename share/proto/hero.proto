syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 英雄列表请求（路由 10020）
message HeroListReq {
}

// 英雄列表响应
message HeroListResp {
  Result result = 1;
  repeated HeroEntry hero_entries = 2;
}

// 英雄变化通知（路由 10021）
message HeroNotify {
  HeroEntry hero_entry = 1;
}

// 新增英雄请求（路由 10022）
message HeroAddReq {
  int32 cfg_id = 1; // 英雄配置ID
}

// 新增英雄响应
message HeroAddResp {
  Result result = 1;
  HeroEntry hero_entry = 2; // 新增后的持有状态
}

// 更新英雄请求（路由 10023）
message HeroUpdateReq {
  int32 cfg_id = 1;   // 英雄配置ID
  int32 level = 2;    // 等级
  int64 exp = 3;       // 经验
  int32 star = 4;      // 星级
  int32 skin_id = 5;   // 皮肤ID
  bool equipped = 6;   // 是否出战
}

// 更新英雄响应
message HeroUpdateResp {
  Result result = 1;
  HeroEntry hero_entry = 2; // 更新后的持有状态
}

// 查看英雄累计属性请求（路由 10024）
message HeroAttributeReq {
  int32 cfg_id = 1; // 英雄配置ID（0 表示当前出战英雄）
}

// 查看英雄累计属性响应
message HeroAttributeResp {
  Result result = 1;
  HeroEntry hero_entry = 2;   // 英雄持有状态
  HeroAttribute attribute = 3; // 累计属性
}

// 英雄升级请求（路由 10025，消耗升级素材）
message HeroUpgradeReq {
  int32 cfg_id = 1; // 英雄配置ID
}

// 英雄升级响应
message HeroUpgradeResp {
  Result result = 1;
  HeroEntry hero_entry = 2;   // 升级后的持有状态
  HeroAttribute attribute = 3; // 升级后的累计属性
}