syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 英雄列表请求（路由 10600）
message HeroListReq {
}

// 英雄列表响应（服务器按模块分表，但一次下发完整持有：英雄连同绑定的武器/技能/装备）
message HeroListResp {
  Result result = 1;
  repeated HeroEntry hero_entries = 2; // 英雄及其绑定的武器/技能/装备
}

// 英雄变化通知（路由 10601，结构即完整持有，客户端收到后整体刷新该英雄）
message HeroNotify {
  HeroEntry hero_entry = 1;
}

// 新增英雄请求（路由 10602）
message HeroAddReq {
  int32 cfg_id = 1; // 英雄配置ID
}

// 新增英雄响应
message HeroAddResp {
  Result result = 1;
  HeroEntry hero_entry = 2; // 新增后的持有状态
}

// 更新英雄请求（路由 10603）
message HeroUpdateReq {
  int32 cfg_id = 1;   // 英雄配置ID
  int32 level = 2;    // 等级
  int64 exp = 3;       // 经验
  int32 star = 4;      // 星级
  int32 skin_id = 5;   // 皮肤ID
  bool equipped = 6;   // 是否出战
}

// 更新英雄响应
message HeroUpdateResp {
  Result result = 1;
  HeroEntry hero_entry = 2; // 更新后的持有状态
}

// 查看英雄累计属性请求（路由 10604）
message HeroAttributeReq {
  int32 cfg_id = 1; // 英雄配置ID（0 表示当前出战英雄）
}

// 英雄累计属性（固定字段；由英雄本体 + 武器 + 技能 + 装备 + 未来天赋/buff 汇总计算）
message HeroAttribute {
  int32 power = 1;  // 战力 = hp + armor + damage
  int32 hp = 2;     // 生命值
  int32 armor = 3;  // 护甲
  int32 damage = 4; // 伤害
}

// 查看英雄累计属性响应
message HeroAttributeResp {
  Result result = 1;
  HeroEntry hero_entry = 2;   // 英雄持有状态
  HeroAttribute attribute = 3; // 累计属性
}

// 英雄升级请求（路由 10605，消耗升级素材）
message HeroUpgradeReq {
  int32 cfg_id = 1; // 英雄配置ID
}

// 英雄升级响应
message HeroUpgradeResp {
  Result result = 1;
  HeroEntry hero_entry = 2;   // 升级后的持有状态
  HeroAttribute attribute = 3; // 升级后的累计属性
}
