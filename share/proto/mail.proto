syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 邮件状态：未读 → 已读 → 已领取；已领取后可删除，用于红点与一键领取。
enum MailStatus {
  MAIL_STATUS_UNSPECIFIED = 0;
  MAIL_STATUS_UNREAD  = 1; // 未读
  MAIL_STATUS_READ    = 2; // 已读
  MAIL_STATUS_CLAIMED = 3; // 已领取（附件已发放，可删除）
}

// 邮件条目（玩家持有状态）。
message MailEntry {
  int64 id = 1;                       // 邮件实例ID（雪花）
  string title = 2;                   // 标题
  string content = 3;                 // 正文
  repeated AssetEntry attachments = 4; // 附件资产列表（无附件即纯通知）
  MailStatus status = 5;              // 状态
  int64 created_at = 6;               // 发送时间（毫秒时间戳）
  int64 read_at = 7;                  // 已读时间（毫秒时间戳，0 表示未读）
  int64 claimed_at = 8;               // 领取时间（毫秒时间戳，0 表示未领取）
}

// 邮件列表请求（路由 10090）。
message MailListReq {}

// 邮件列表响应。
message MailListResp {
  Result result = 1;
  repeated MailEntry entries = 2; // 邮件列表（未读优先，按创建时间倒序）
  int32 unread_count = 3;         // 未读数量（红点）
}

// 标记已读请求（路由 10091）。
message MailReadReq {
  int64 id = 1; // 邮件实例ID
}

// 标记已读响应。
message MailReadResp {
  Result result = 1;
  MailEntry entry = 2; // 更新后的邮件状态
}

// 全部标记已读请求（路由 10092）。
message MailReadAllReq {}

// 全部标记已读响应。
message MailReadAllResp {
  Result result = 1;
}

// 领取附件请求（路由 10093）。
message MailClaimReq {
  int64 id = 1; // 邮件实例ID
}

// 领取附件响应。
message MailClaimResp {
  Result result = 1;
  MailEntry entry = 2;               // 更新后的邮件状态
  repeated AssetEntry attachments = 3; // 实际发放的附件
}

// 一键领取全部附件请求（路由 10094）。
message MailClaimAllReq {}

// 一键领取全部附件响应。
message MailClaimAllResp {
  Result result = 1;
  repeated MailEntry entries = 2; // 本次领取到附件的邮件
}

// 删除邮件请求（路由 10095）。
// 奖励邮件未领取时禁止删除；纯通知邮件任意状态可删；已领取邮件可删。
message MailDeleteReq {
  int64 id = 1; // 邮件实例ID
}

// 删除邮件响应。
message MailDeleteResp {
  Result result = 1;
}

// 清理可删除邮件请求（路由 10096）：删除所有可删邮件（已读/已领取，或无附件）。
message MailDeleteCleanReq {}

// 清理可删除邮件响应。
message MailDeleteCleanResp {
  Result result = 1;
  int32 count = 2; // 实际删除数量
}
