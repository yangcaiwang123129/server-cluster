syntax = "proto3";

package pb;

import "common.proto";
import "hero.proto";

option go_package = "server-cluster/share/pb";

// 新增装备请求（路由 10902）
message EquipAddReq {
  int32 cfg_id = 1; // 装备配置ID
  int32 hero_id = 2; // 所属英雄ID，0 表示当前出战英雄
}

// 新增装备响应
message EquipAddResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 新增后的持有状态
}

// 更新装备请求（路由 10903）
message EquipUpdateReq {
  int64 id = 1;           // 装备实例ID
  int32 level = 2;        // 等级
  bool equipped = 3;      // 是否穿戴
  int32 hero_id = 4;      // 所属英雄ID，0 表示保持原归属
  int32 quality = 5;      // 品质
  int32 breakthrough = 6; // 突破
}

// 更新装备响应
message EquipUpdateResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 更新后的持有状态
}

// 装备升级请求（路由 10904，消耗升级素材）
message EquipUpgradeReq {
  int64 id = 1; // 装备实例ID
}

// 装备升级响应
message EquipUpgradeResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 升级后的持有状态
  HeroAttribute attribute = 3; // 升级后的英雄累计属性
}

// 装备升品请求（路由 10905，消耗升品素材）
message EquipUpQualityReq {
  int64 id = 1; // 装备实例ID
}

// 装备升品响应
message EquipUpQualityResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 升品后的持有状态
  HeroAttribute attribute = 3; // 升品后的英雄累计属性
}

// 装备突破请求（路由 10906，消耗突破素材）
message EquipBreakthroughReq {
  int64 id = 1; // 装备实例ID
}

// 装备突破响应
message EquipBreakthroughResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 突破后的持有状态
  HeroAttribute attribute = 3; // 突破后的英雄累计属性
}

// 穿戴装备请求（路由 10907）
message EquipWearReq {
  int64 id = 1;      // 装备实例ID
  int32 hero_id = 2; // 目标英雄ID，0 表示当前出战英雄
}

// 穿戴装备响应
message EquipWearResp {
  Result result = 1;
  EquipEntry equip_entry = 2;   // 穿戴后的持有状态
  HeroAttribute attribute = 3;  // 操作后的英雄累计属性
}

// 卸载装备请求（路由 10908）
message EquipUnwearReq {
  int64 id = 1; // 装备实例ID
}

// 卸载装备响应
message EquipUnwearResp {
  Result result = 1;
  EquipEntry equip_entry = 2;   // 卸载后的持有状态
  HeroAttribute attribute = 3;  // 操作后的英雄累计属性
}
