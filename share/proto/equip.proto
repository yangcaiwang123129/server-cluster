syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 装备列表请求（路由 10050）
message EquipListReq {
}

// 装备列表响应
message EquipListResp {
  Result result = 1;
  repeated EquipEntry equip_entries = 2;
}

// 装备变化通知（路由 10051）
message EquipNotify {
  EquipEntry equip_entry = 1;
}

// 新增装备请求（路由 10052）
message EquipAddReq {
  int32 cfg_id = 1; // 装备配置ID
}

// 新增装备响应
message EquipAddResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 新增后的持有状态
}

// 更新装备请求（路由 10053）
message EquipUpdateReq {
  int32 cfg_id = 1;  // 装备配置ID
  int32 level = 2;    // 等级
  bool equipped = 3;  // 是否穿戴
}

// 更新装备响应
message EquipUpdateResp {
  Result result = 1;
  EquipEntry equip_entry = 2; // 更新后的持有状态
}

