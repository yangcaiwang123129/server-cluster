syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 验证令牌请求（路由 10000）
message VerifyReq {
  string token = 1; // 登录令牌
}

// 验证令牌响应
message VerifyResp {
}

// 进入游戏请求（路由 10001）
message EnterGameReq {
  string token = 1;
}

// 进入游戏响应（登录成功后返回给客户端的结构体）
message EnterGameResp {
  PlayerBase base = 1;   // 玩家基础信息
  int64 server_time = 2; // 服务器毫秒时间戳
}

// 离开游戏请求（路由 10002）
message LeaveGameReq {
}

// 离开游戏响应
message LeaveGameResp {
}