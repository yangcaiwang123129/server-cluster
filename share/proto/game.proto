syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 验证令牌请求（路由 10000）
message VerifyReq {
  string token = 1; // 登录令牌
}

// 验证令牌响应
message VerifyResp {
  Result result = 1;
}

// 进入游戏请求（路由 10001）
message EnterGameReq {
  string token = 1;
}

// 进入游戏响应（登录成功后返回给客户端的结构体）
message EnterGameResp {
  Result result = 1;               // 业务结果
  MagicAttr player_magic_attr = 2; // 玩家属性
  HeroEntry hero_entry = 3;        // 当前英雄
  WeaponEntry weapon_entry = 4;    // 当前武器
  int64 server_time = 5;           // 服务器毫秒时间戳
}

// 离开游戏请求（路由 10002）
message LeaveGameReq {
}

// 离开游戏响应
message LeaveGameResp {
  Result result = 1;
}

// 系统通知
message ServerNotify {
  NOTIFY_TYPE notify_type = 1;     // 通知类型
  string content = 2; // 通知内容
}