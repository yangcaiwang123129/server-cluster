syntax = "proto3";

package pb;

option go_package = "server-cluster/share/pb";

// 玩家基础信息（登录进入游戏时下发的通用结构）
message PlayerBase {
  int64 uid = 1;     // 玩家ID
  string name = 2;   // 昵称
  int32 level = 3;   // 等级
  int64 exp = 4;     // 经验
  int64 gold = 5;    // 金币
  int64 diamond = 6; // 钻石
}

// 进入游戏请求（路由 2001）
message EnterGameReq {
  string token = 1; // 登录令牌
}

// 进入游戏响应（登录成功后返回给客户端的结构体）
message EnterGameResp {
  PlayerBase base = 1;   // 玩家基础信息
  int64 server_time = 2; // 服务器毫秒时间戳
}

// 拉取玩家信息请求（路由 2002，无参数）
message GetPlayerInfoReq {
}

// 拉取玩家信息响应
message GetPlayerInfoResp {
  PlayerBase base = 1;
}
