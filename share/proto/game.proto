syntax = "proto3";

package pb;

import "common.proto";
import "task.proto";
import "activity.proto";

option go_package = "server-cluster/share/pb";

// 验证令牌请求（路由 10000）
message VerifyReq {
  string token = 1; // 登录令牌
}

// 验证令牌响应
message VerifyResp {
  Result result = 1;
}

// 进入游戏请求（路由 10001）
message EnterGameReq {
  string token = 1;
}

// 进入游戏响应（登录成功后返回给客户端的结构体）
message EnterGameResp {
  Result result = 1;               // 业务结果
  AttrMap player_attr = 2;         // 玩家属性（键为 Attr 枚举值）
  HeroEntry hero_entry = 3;        // 当前英雄（已含绑定武器）
  int64 server_time = 4;           // 服务器毫秒时间戳
  map<int32, TaskEntry> tasks = 5; // 任务列表（key键为任务配置ID）
  map<int64, ActivityEntry> activities = 6; // 活动列表（key为活动实例ID）
}

// 离开游戏请求（路由 10002）
message LeaveGameReq {
}

// 离开游戏响应
message LeaveGameResp {
  Result result = 1;
}

// 系统通知
message ServerNotify {
  NOTIFY_TYPE notify_type = 1;     // 通知类型
  string content = 2; // 通知内容
}

// 购买礼包请求（路由 10004）
message GiftBuyReq {
  int32 cfg_id = 1; // 礼包配置ID（GiftCfg.Id）
}
// 购买礼包响应
message GiftBuyResp {
  Result result = 1;
  repeated AssetEntry costs = 2;    // 实际消耗的资产
  repeated AssetEntry rewards = 3;  // 实际发放的奖励
}

// 兑换请求（路由 10005）
message ExchangeReq {
  int32 cfg_id = 1; // 兑换配置ID（ExchangeCfg.Id）
}

// 兑换响应
message ExchangeResp {
  Result result = 1;
  repeated AssetEntry costs = 2;    // 实际消耗的资产
  repeated AssetEntry rewards = 3;  // 实际发放的奖励
}

// 充值请求（路由 10006）
// 当前为假充值：服务端不做订单校验，直接按配置发放奖励。
message RechargeReq {
  int32 cfg_id = 1; // 充值配置ID（RechargeCfg.Id）
}

// 充值响应
message RechargeResp {
  Result result = 1;
  repeated AssetEntry rewards = 2; // 实际发放的奖励
}

// 属性操作请求（路由 10007）：客户端传属性类型，服务端按类型处理
message AttrOperateReq {
  AttrOperate operate = 1; // 操作类型：更新/领取
  int32 attr = 2;          // 属性类型（Attr 枚举值）
  ObjectValue value = 3;   // 更新目标值（领取时忽略）
}

// 属性操作响应
message AttrOperateResp {
  Result result = 1;
  map<int32, ObjectValue> values = 2; // 操作后的属性值，键为 Attr 枚举值
}

// 玩家属性变化通知（路由 10008）：服务端主动推送，当前用于货币快照
message AttrNotify {
  AttrMap values = 1; // 变更后的属性值，键为 Attr 枚举值
}
