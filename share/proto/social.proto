syntax = "proto3";

package pb;

option go_package = "server-cluster/share/pb";

// 发送聊天请求（路由 4001）
message SendChatReq {
  string channel = 1; // world / guild / private
  string content = 2;
  int64 to_uid = 3; // 私聊目标
}

// 发送聊天响应
message SendChatResp {
  int64 msg_id = 1;
}

// 聊天消息通知（路由 4901，服务端主动推送）
message ChatMessageNotify {
  int64 msg_id = 1;
  int64 from_uid = 2;
  string from_name = 3;
  string channel = 4;
  string content = 5;
  int64 time = 6; // 服务器毫秒时间戳
}
