// 内部服务间 RPC：由各节点以 grpc provider 形式提供，后台/网格服务调用。
syntax = "proto3";

package internal;

import "common.proto";
import "item.proto";
import "equip.proto";
import "mail.proto";
import "hero.proto";

option go_package = "server-cluster/share/pb";

// OnlinePlayer 在线玩家信息。
message OnlinePlayer {
  int64 player_id = 1;   // 玩家ID
  int64 enter_time = 2;  // 进入游戏时间（秒级时间戳）
  string node_id = 3;    // 所在 game 服实例 ID
  string login_ip = 4;   // 登录 IP（网关从连接获取，内存中维护，不落库）
}

// GetOnlinePlayersReq 查看在线玩家请求。
message GetOnlinePlayersReq {}

// GetOnlinePlayersResp 查看在线玩家响应。
message GetOnlinePlayersResp {
  repeated OnlinePlayer players = 1; // 在线玩家列表
}

// KickPlayerReq 踢玩家下线请求（调用方按 game 实例分组定向调用，每实例一批玩家）。
message KickPlayerReq {
  repeated int64 player_ids = 1; // 玩家ID列表
}

// KickPlayerResp 踢玩家下线响应。
message KickPlayerResp {
  repeated int64 failed_ids = 1; // 踢失败（不在线等）的玩家ID
}

//  ========== 管理后台 GM（admin 服经 mesh 定向调用 game 服，入参统一携带 playerID） ==========

// GmItemListReq 物品容器列表请求。
message GmItemListReq {
  int64 player_id = 1;            // 玩家ID
  pb.ItemContainerListReq req = 2; // 业务参数（物品容器类型）
}

// GmItemMoveReq 物品容器内移动对象请求。
message GmItemMoveReq {
  int64 player_id = 1;      // 玩家ID
  pb.ItemMoveReq req = 2;   // 业务参数
}

// GmItemRotateReq 物品容器内旋转对象请求。
message GmItemRotateReq {
  int64 player_id = 1;      // 玩家ID
  pb.ItemRotateReq req = 2; // 业务参数
}

// GmItemSortReq 物品容器一键整理请求。
message GmItemSortReq {
  int64 player_id = 1;    // 玩家ID
  pb.ItemSortReq req = 2; // 业务参数
}

// GmItemTransferReq 物品容器间移动对象请求。
message GmItemTransferReq {
  int64 player_id = 1;        // 玩家ID
  pb.ItemTransferReq req = 2; // 业务参数
}

// GmItemAddEntryReq 向物品容器放入对象请求（坐标为左上角格）。
message GmItemAddEntryReq {
  int64 player_id = 1;  // 玩家ID
  int32 container_type = 2;  // 物品容器类型：1 背包 2 仓库 3 保险箱
  int32 cfg_id = 3;     // 对象配置ID
  int32 count = 4;      // 堆叠数量
  int32 grid_x = 5;     // 网格X
  int32 grid_y = 6;     // 网格Y
  bool rotated = 7;     // 是否旋转放置
}

// GmHeroListReq 英雄列表请求。
message GmHeroListReq {
  int64 player_id = 1; // 玩家ID
}

// GmHeroAddReq 新增英雄请求。
message GmHeroAddReq {
  int64 player_id = 1; // 玩家ID
  pb.HeroAddReq req = 2; // 业务参数
}

// GmHeroUpdateReq 更新英雄请求。
message GmHeroUpdateReq {
  int64 player_id = 1; // 玩家ID
  pb.HeroUpdateReq req = 2; // 业务参数
}

// GmHeroAttributeReq 查看英雄累计属性请求。
message GmHeroAttributeReq {
  int64 player_id = 1; // 玩家ID
  int32 hero_id = 2;   // 英雄配置ID（0 表示出战英雄）
}

// GmHeroUpgradeReq 英雄升级请求。
message GmHeroUpgradeReq {
  int64 player_id = 1; // 玩家ID
  int32 hero_id = 2;   // 英雄配置ID
}

// GmEquipListReq 装备列表请求。
message GmEquipListReq {
  int64 player_id = 1; // 玩家ID
}

// GmEquipListResp 装备列表响应（GM 专用，玩家协议不再单独下发列表）。
message GmEquipListResp {
  repeated pb.EquipEntry entries = 1;
}

// GmEquipAddReq 新增装备请求。
message GmEquipAddReq {
  int64 player_id = 1; // 玩家ID
  pb.EquipAddReq req = 2; // 业务参数
}

// GmEquipUpdateReq 更新装备请求。
message GmEquipUpdateReq {
  int64 player_id = 1; // 玩家ID
  pb.EquipUpdateReq req = 2; // 业务参数
}

// GmEquipUpgradeReq 装备升级请求。
message GmEquipUpgradeReq {
  int64 player_id = 1; // 玩家ID
  int64 equip_id = 2;  // 装备实例ID
}

// GmEquipUpQualityReq 装备升品请求。
message GmEquipUpQualityReq {
  int64 player_id = 1; // 玩家ID
  int64 equip_id = 2;  // 装备实例ID
}

// GmEquipBreakthroughReq 装备突破请求。
message GmEquipBreakthroughReq {
  int64 player_id = 1; // 玩家ID
  int64 equip_id = 2;  // 装备实例ID
}

// GmEquipWearReq 装备穿戴请求。
message GmEquipWearReq {
  int64 player_id = 1; // 玩家ID
  int64 equip_id = 2;  // 装备实例ID
  int32 hero_id = 3;   // 目标英雄ID，0 表示出战英雄
}

// GmEquipUnwearReq 装备卸载请求。
message GmEquipUnwearReq {
  int64 player_id = 1; // 玩家ID
  int64 equip_id = 2;  // 装备实例ID
}

// GmMailListReq 邮件列表请求（GM 后台查看玩家邮件）。
message GmMailListReq {
  int64 player_id = 1; // 玩家ID
}

// GmMailListResp 邮件列表响应（GM 专用）。
message GmMailListResp {
  repeated pb.MailEntry entries = 1;
}

// GmMailSendReq 后台发送邮件请求。
message GmMailSendReq {
  int64 player_id = 1;               // 玩家ID
  string title = 2;                  // 标题
  string content = 3;                // 正文
  repeated pb.AssetEntry attachments = 4; // 附件资产（可空，空则为纯通知）
}

// GameAdminService 后台 GM 服务（game 服提供，admin 服调用）。
service GameAdminService {
  // GetOnlinePlayers 查看在线玩家列表
  rpc GetOnlinePlayers (GetOnlinePlayersReq) returns (GetOnlinePlayersResp);
  // KickPlayer 踢玩家下线
  rpc KickPlayer (KickPlayerReq) returns (KickPlayerResp);

  // ItemList 物品容器列表
  rpc ItemList (GmItemListReq) returns (pb.ItemContainerListResp);
  // ItemMove 物品容器内移动对象
  rpc ItemMove (GmItemMoveReq) returns (pb.ItemMoveResp);
  // ItemRotate 物品容器内旋转对象
  rpc ItemRotate (GmItemRotateReq) returns (pb.ItemRotateResp);
  // ItemSort 物品容器一键整理
  rpc ItemSort (GmItemSortReq) returns (pb.ItemSortResp);
  // ItemTransfer 物品容器间移动对象
  rpc ItemTransfer (GmItemTransferReq) returns (pb.ItemTransferResp);
  // ItemAddEntry 向物品容器放入对象（返回变更后的物品容器）
  rpc ItemAddEntry (GmItemAddEntryReq) returns (pb.ItemContainerListResp);

  // HeroList 英雄列表
  rpc HeroList (GmHeroListReq) returns (pb.HeroListResp);
  // HeroAdd 新增英雄
  rpc HeroAdd (GmHeroAddReq) returns (pb.HeroAddResp);
  // HeroUpdate 更新英雄
  rpc HeroUpdate (GmHeroUpdateReq) returns (pb.HeroUpdateResp);
  // HeroAttribute 查看英雄累计属性
  rpc HeroAttribute (GmHeroAttributeReq) returns (pb.HeroAttributeResp);
  // HeroUpgrade 英雄升级（消耗物品）
  rpc HeroUpgrade (GmHeroUpgradeReq) returns (pb.HeroUpgradeResp);

  // EquipList 装备列表
  rpc EquipList (GmEquipListReq) returns (GmEquipListResp);
  // EquipAdd 新增装备
  rpc EquipAdd (GmEquipAddReq) returns (pb.EquipAddResp);
  // EquipUpdate 更新装备
  rpc EquipUpdate (GmEquipUpdateReq) returns (pb.EquipUpdateResp);
  // EquipUpgrade 装备升级（消耗物品）
  rpc EquipUpgrade (GmEquipUpgradeReq) returns (pb.EquipUpgradeResp);
  // EquipUpQuality 装备升品（消耗物品）
  rpc EquipUpQuality (GmEquipUpQualityReq) returns (pb.EquipUpQualityResp);
  // EquipBreakthrough 装备突破（消耗物品）
  rpc EquipBreakthrough (GmEquipBreakthroughReq) returns (pb.EquipBreakthroughResp);
  // EquipWear 装备穿戴（同英雄同配置自动顶替）
  rpc EquipWear (GmEquipWearReq) returns (pb.EquipWearResp);
  // EquipUnwear 装备卸载
  rpc EquipUnwear (GmEquipUnwearReq) returns (pb.EquipUnwearResp);

  // MailList 玩家邮件列表
  rpc MailList (GmMailListReq) returns (GmMailListResp);
  // MailSend 后台发送邮件（可带附件）
  rpc MailSend (GmMailSendReq) returns (pb.MailEntry);
}
