// 内部服务间 RPC：由各节点以 grpc provider 形式提供，后台/网格服务调用。
syntax = "proto3";

package internal;

option go_package = "server-cluster/share/pb";

// OnlinePlayer 在线玩家信息。
message OnlinePlayer {
  int64 player_id = 1;  // 玩家ID
  int64 enter_time = 2; // 进入游戏时间（秒级时间戳）
}

// GetOnlinePlayersReq 查看在线玩家请求。
message GetOnlinePlayersReq {}

// GetOnlinePlayersResp 查看在线玩家响应。
message GetOnlinePlayersResp {
  repeated OnlinePlayer players = 1; // 在线玩家列表
}

// PlayerService 玩家相关内部服务（game 服提供）。
service PlayerService {
  // GetOnlinePlayers 查看在线玩家列表
  rpc GetOnlinePlayers (GetOnlinePlayersReq) returns (GetOnlinePlayersResp);
}
