syntax = "proto3";

package pb;

import "common.proto";

option go_package = "server-cluster/share/pb";

// 武器列表请求（路由 10030）
message WeaponListReq {
}

// 武器列表响应
message WeaponListResp {
  Result result = 1;
  repeated WeaponEntry weapon_entries = 2;
}

// 武器变化通知（路由 10031）
message WeaponNotify {
  WeaponEntry weapon_entry = 1;
}

// 新增武器请求（路由 10032）
message WeaponAddReq {
  int32 cfg_id = 1; // 武器配置ID
}

// 新增武器响应
message WeaponAddResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 新增后的持有状态
}

// 更新武器请求（路由 10033）
message WeaponUpdateReq {
  int32 cfg_id = 1;   // 武器配置ID
  int32 level = 2;    // 等级
  int32 durability = 3;  // 耐久度
  bool equipped = 4;     // 是否装备
}

// 更新武器响应
message WeaponUpdateResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 更新后的持有状态
}