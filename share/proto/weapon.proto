syntax = "proto3";

package pb;

import "common.proto";
import "hero.proto";

option go_package = "server-cluster/share/pb";

// 更新武器请求（路由 10703）
message WeaponUpdateReq {
  int32 cfg_id = 1;       // 武器配置ID
  int32 level = 2;        // 等级
  int32 durability = 3;   // 耐久度
  int32 quality = 4;      // 品质
  int32 breakthrough = 5; // 突破
}

// 更新武器响应
message WeaponUpdateResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 更新后的持有状态
}

// 武器升级请求（路由 10704，消耗升级素材）
message WeaponUpgradeReq {
  int32 cfg_id = 1; // 武器配置ID
}

// 武器升级响应
message WeaponUpgradeResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 升级后的持有状态
  HeroAttribute attribute = 3; // 升级后的英雄累计属性
}

// 武器升品请求（路由 10705，消耗升品素材）
message WeaponUpQualityReq {
  int32 cfg_id = 1; // 武器配置ID
}

// 武器升品响应
message WeaponUpQualityResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 升品后的持有状态
  HeroAttribute attribute = 3; // 升品后的英雄累计属性
}

// 武器突破请求（路由 10706，消耗突破素材）
message WeaponBreakthroughReq {
  int32 cfg_id = 1; // 武器配置ID
}

// 武器突破响应
message WeaponBreakthroughResp {
  Result result = 1;
  WeaponEntry weapon_entry = 2; // 突破后的持有状态
  HeroAttribute attribute = 3; // 突破后的英雄累计属性
}
