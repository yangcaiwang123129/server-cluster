syntax = "proto3";

package pb;

option go_package = "server-cluster/share/pb";

// 客户端路由号枚举：按业务分模块，玩家预留 500 个号，其余模块预留 100 个号（玩家 10000~10499、物品 10500~10599）。
enum RouteCode {
  // 游戏大厅服 10000~49999
  ROUTE_CODE_UNSPECIFIED = 0;

  // 玩家 10000~10499（预留 500 个号）
  ROUTE_CODE_VERIFY = 10000; // 首包，验证账号令牌，用于绑定节点和网关
  ROUTE_CODE_ENTER_GAME = 10001; // 进入游戏
  ROUTE_CODE_LEAVE_GAME = 10002; // 离开游戏
  ROUTE_CODE_SERVER_NOTIFY = 10003; // 服务器通知
  ROUTE_CODE_GIFT_BUY = 10004; // 购买礼包
  ROUTE_CODE_EXCHANGE = 10005; // 兑换
  ROUTE_CODE_RECHARGE = 10006; // 充值（当前为假充值，直接发放奖励）
  ROUTE_CODE_ATTR_OPERATE = 10007; // 属性操作（按属性类型更新/领取）
  ROUTE_CODE_ATTR_NOTIFY = 10008; // 玩家属性变化通知

  // 玩家物品 10500~10599
  ROUTE_CODE_ITEM_LIST = 10500;  // 物品容器列表
  ROUTE_CODE_ITEM_NOTIFY = 10501;  // 物品容器内变化通知
  ROUTE_CODE_ITEM_ADD = 10502;  // 物品容器内对象添加(预发布和生产环境不开放)
  ROUTE_CODE_ITEM_MOVE = 10503;  // 物品容器内对象移动
  ROUTE_CODE_ITEM_ROTATE = 10504;  // 物品容器内对象旋转
  ROUTE_CODE_ITEM_SORT = 10505;  // 物品容器一键整理对象
  ROUTE_CODE_ITEM_TRANSFER = 10506;  // 物品容器间对象移动

  // 英雄 10600~10699
  ROUTE_CODE_HERO_LIST = 10600; // 英雄列表
  ROUTE_CODE_HERO_NOTIFY = 10601; // 英雄变化通知
  ROUTE_CODE_HERO_ADD = 10602; // 新增英雄(预发布和生产环境不开放)
  ROUTE_CODE_HERO_UPDATE = 10603; // 更新英雄(预发布和生产环境不开放)
  ROUTE_CODE_HERO_ATTRIBUTE = 10604; // 查看英雄累计属性
  ROUTE_CODE_HERO_UPGRADE = 10605; // 英雄升级（消耗物品）

  // 武器 10700~10799
  ROUTE_CODE_WEAPON_UPDATE = 10703; // 更新武器(预发布和生产环境不开放)
  ROUTE_CODE_WEAPON_UPGRADE = 10704; // 武器升级（消耗物品）
  ROUTE_CODE_WEAPON_UP_QUALITY = 10705; // 武器升品（消耗物品）
  ROUTE_CODE_WEAPON_BREAKTHROUGH = 10706; // 武器突破（消耗物品）

  // 技能 10800~10899
  ROUTE_CODE_SKILL_UPDATE = 10803; // 更新技能(预发布和生产环境不开放)
  ROUTE_CODE_SKILL_UPGRADE = 10804; // 技能升级（消耗物品）
  ROUTE_CODE_SKILL_UP_QUALITY = 10805; // 技能升品（消耗物品）
  ROUTE_CODE_SKILL_BREAKTHROUGH = 10806; // 技能突破（消耗物品）

  // 装备 10900~10999
  ROUTE_CODE_EQUIP_ADD = 10902; // 新增装备(预发布和生产环境不开放)
  ROUTE_CODE_EQUIP_UPDATE = 10903; // 更新装备(预发布和生产环境不开放)
  ROUTE_CODE_EQUIP_UPGRADE = 10904; // 装备升级（消耗物品）
  ROUTE_CODE_EQUIP_UP_QUALITY = 10905; // 装备升品（消耗物品）
  ROUTE_CODE_EQUIP_BREAKTHROUGH = 10906; // 装备突破（消耗物品）
  ROUTE_CODE_EQUIP_WEAR = 10907;         // 穿戴装备（同英雄同配置自动顶替）
  ROUTE_CODE_EQUIP_UN_WEAR = 10908;       // 卸载装备

  // 邮件 11000~11099
  ROUTE_CODE_MAIL_LIST = 11000;          // 邮件列表（含未读数）
  ROUTE_CODE_MAIL_READ = 11001;          // 标记已读
  ROUTE_CODE_MAIL_READ_ALL = 11002;      // 全部标记已读
  ROUTE_CODE_MAIL_CLAIM = 11003;         // 领取附件
  ROUTE_CODE_MAIL_CLAIM_ALL = 11004;     // 一键领取全部附件
  ROUTE_CODE_MAIL_DELETE = 11005;        // 删除邮件
  ROUTE_CODE_MAIL_DELETE_CLEAN = 11006;  // 清理可删除邮件

  // 任务 11200~11299
  ROUTE_CODE_TASK_LIST = 11200;   // 任务列表（含进度/红点）
  ROUTE_CODE_TASK_NOTIFY = 11201; // 任务进度/状态变化通知
  ROUTE_CODE_TASK_CLAIM = 11202;  // 任务领奖
  ROUTE_CODE_TASK_ACCEPT = 11203; // 任务接取（手动接取任务）

  // 战斗服 50000~59999

  // 社交服 60000~69999
}

//  ========== 业务错误码枚举（1000~9999） ==========
enum ErrCode {
  ERR_CODE_OK = 0;           // 成功
  ERR_CODE_FORBIDDEN = 403;  // 无接口访问权限（admin HTTP RBAC 拒绝/账号停用）
  ERR_CODE_INTERNAL = 500;   // 内部错误兜底（admin HTTP 依赖故障/上游不可达）
  ERR_CODE_INTERNAL_ERROR = 1000;
  ERR_CODE_INVALID_PARAMS = 1001;
  ERR_CODE_UNAUTHORIZED = 1002;
  ERR_CODE_PLAYER_NOT_FOUND = 2000;
  ERR_CODE_PLAYER_EXISTS = 2001;
  ERR_CODE_PASSWORD_WRONG = 2002;
  ERR_CODE_TOKEN_INVALID = 2003;
  // 登录鉴权
  ERR_CODE_PLAYER_BANNED = 3001;    // 玩家已封禁
  ERR_CODE_SMS_CODE_INVALID = 3002; // 短信验证码错误或已过期
  ERR_CODE_SMS_COOLDOWN = 3003;     // 短信发送冷却中
  ERR_CODE_AUTH_TYPE_UNKNOWN = 3004; // 未知鉴权类型
  // 活动
  ERR_CODE_ACTIVITY_NOT_FOUND = 4001;       // 活动不存在
  ERR_CODE_ACTIVITY_NOT_RUNNING = 4002;     // 活动未开启/已结束
  ERR_CODE_ACTIVITY_ALREADY_CLAIMED = 4003; // 活动奖励已领
  ERR_CODE_SIGN_IN_ALREADY = 4004;          // 今日已签到
  // 任务
  ERR_CODE_TASK_NOT_FOUND = 4101;           // 任务不存在
  ERR_CODE_TASK_NOT_COMPLETED = 4102;       // 任务未完成
  ERR_CODE_TASK_ALREADY_CLAIMED = 4103;     // 任务已领奖
  ERR_CODE_TASK_EXPIRED = 4104;             // 任务周期已过期
  ERR_CODE_TASK_NOT_ACCEPTED = 4105;        // 任务未接取
  // 活动（活动/任务快照）
  ERR_CODE_ACTIVITY_UNAVAILABLE = 4201;     // 活动快照未就绪
}

//  ========== 通知类型 ==========
enum NOTIFY_TYPE {
  NOTIFY_TYPE_KICK = 0; // 踢下线
  NOTIFY_TYPE_MAINTAIN = 2; // 维护
  NOTIFY_TYPE_BROADCAST = 3; // 公告
}

// ========== 物品容器类型枚举 ==========

enum ContainerType {
  CONTAINER_TYPE_UNSPECIFIED = 0;
  CONTAINER_TYPE_BACKPACK = 1; // 背包（局内随身，死亡掉落）
  CONTAINER_TYPE_STASH = 2;    // 仓库（局外固定，不掉落）
  CONTAINER_TYPE_SECURE = 3;   // 保险箱（局内随身，不掉落）
}

//  ========== 属性动作类型 ==========
enum AttrOperate {
  UPDATE = 0; // 更新
  CLAIM = 1; // 领取
}

//  ========== 属性枚举 ==========
enum Attr {
  // 1~999 玩家相关属性
  PLAYER_ATTR_UNSPECIFIED = 0;
  PLAYER_ATTR_NAME = 1;      // 昵称：string
  PLAYER_ATTR_LEVEL = 2;     // 等级：int32
  PLAYER_ATTR_EXP = 3;       // 经验：int64
  PLAYER_ATTR_VIP_LEVEL = 4; // vip等级：int32
  PLAYER_ATTR_VIP_EXP = 5;   // vip经验：int64
  PLAYER_ATTR_COIN = 6;      // 币：int64
  PLAYER_ATTR_GOLD = 7;      // 金：int64
  PLAYER_ATTR_SIGNATURE = 8;      // 个性签名：string
  PLAYER_ATTR_SETTINGS_JSON = 9;      // 个人设置：string
  PLAYER_ATTR_COUPON = 10;      // 点券：int64
  // 1000~4999 任务/成就进度与领奖标记
  // 5000~9999 活动状态标记
  // 10001~20000 红点相关属性
}

// 属性表：键为 Attr 枚举值，值为动态类型
message AttrMap {
  map<int32, ObjectValue> values = 1;
}

// 通用业务结果：每个响应包统一携带。
message Result {
  ErrCode code = 1;         // 业务错误码，ERR_CODE_OK 表示成功
  string msg = 2;           // 错误描述（服务端可覆盖默认文案）
  repeated string args = 3; // 可变参数
}

// 通用对象：等价于 JSON object，键为字段名，值为动态类型。
message Object {
  map<string, ObjectValue> values = 1; // 映射
}

// 动态值数组。
message ObjectList {
  repeated ObjectValue values = 1; // 列表
}

// 动态值：oneof 通用基本类型。
message ObjectValue {
  oneof kind {
    bool bool_value = 1;     // 布尔
    int32 int_value = 2;     // 整数
    int64 Bigint_value = 3;  // 整数
    double double_value = 4; // 浮点数
    string string_value = 5; // 字符串
  }
}

// 资产条目：类型 + 配置ID + 数量（奖励/消耗应答用）
message AssetEntry {
  int32 type = 1;   // 资产类型（对应 tpl.AssetType）
  int32 cfg_id = 2; // 配置ID
  int32 count = 3;  // 数量
}

// 物品容器中的物品
message ItemEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 count = 3;       // 堆叠数量
  int32 grid_x = 4;      // 网格 X
  int32 grid_y = 5;      // 网格 Y
  bool rotated = 6;      // 是否旋转
}

// 物品容器条目
message ItemContainer {
  int64 id = 1;                        // 物品容器实例ID（=playerID + type 编码）
  ContainerType type = 2;              // 物品容器类型
  int32 grid_w = 3;                    // 网格宽度
  int32 grid_h = 4;                    // 网格高度
  int32 version = 5;                   // 操作版本号（每次修改+1）
  repeated ItemEntry item_entries = 6; // 物品列表
}

// 英雄持有（仅状态，静态属性由 cfg_id 关联英雄配置表；武器/技能/装备为独立模块）
message HeroEntry {
  int32 cfg_id = 1;    // 英雄配置ID（唯一标识）
  int32 level = 2;     // 等级
  int64 exp = 3;       // 经验
  int32 star = 4;      // 星级
  int32 skin_id = 5;   // 皮肤ID
  bool equipped = 6;   // 是否出战
  WeaponEntry weapon = 7;           // 绑定的武器（配置固定绑定，未拥有时为空）
  repeated SkillEntry skills = 8;   // 绑定的技能
  repeated EquipEntry equips = 9;   // 该英雄已穿戴的装备
}

// 武器持有（固定绑定英雄，仅状态，静态属性由 cfg_id 关联武器配置表）
message WeaponEntry {
  int32 cfg_id = 1;       // 武器配置ID
  int32 level = 2;        // 等级
  int32 durability = 3;   // 耐久度
  int32 quality = 4;      // 品质
  int32 breakthrough = 5; // 突破
}

// 技能持有（固定绑定英雄，仅状态，静态属性由 cfg_id 关联技能配置表）
message SkillEntry {
  int32 cfg_id = 1;       // 技能配置ID
  int32 level = 2;        // 等级
  int32 quality = 3;      // 品质
  int32 breakthrough = 4; // 突破
}

// 装备持有（仅状态，静态属性由 equip_id 关联装备配置表）
message EquipEntry {
  int64 id = 1;           // 实例ID
  int32 cfg_id = 2;       // 配置ID
  int32 level = 3;        // 等级
  bool equipped = 4;      // 是否穿戴
  int32 hero_id = 5;      // 所属英雄ID，0 表示未分配
  int32 quality = 6;      // 品质
  int32 breakthrough = 7; // 突破
}
