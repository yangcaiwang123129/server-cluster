syntax = "proto3";

package pb;

option go_package = "server-cluster/share/pb";

// 客户端路由号枚举
// 按业务分号段：每个业务 10 个号，便于后续在同段内扩展。
enum RouteCode {
  // 游戏大厅服 10000~49999
  ROUTE_CODE_UNSPECIFIED = 0;

  // 玩家 10000~10009
  ROUTE_CODE_VERIFY = 10000; // 首包，验证账号令牌，用于绑定节点和网关
  ROUTE_CODE_ENTER_GAME = 10001; // 进入游戏
  ROUTE_CODE_LEAVE_GAME = 10002; // 离开游戏
  ROUTE_CODE_SEVER_NOTIFY = 10003; // 服务器通知

  // 玩家容器 10010~10019
  ROUTE_CODE_CONTAINER_LIST = 10010;  // 容器列表
  ROUTE_CODE_CONTAINER_NOTIFY = 10011;  // 容器内变化通知
  ROUTE_CODE_CONTAINER_ADD = 10012;  // 容器内对象添加(预发布和生成环境不开放)
  ROUTE_CODE_CONTAINER_MOVE = 10013;  // 容器内对象移动
  ROUTE_CODE_CONTAINER_ROTATE = 10014;  // 容器内对象旋转
  ROUTE_CODE_CONTAINER_SORT = 10015;  // 容器一键整理对象
  ROUTE_CODE_CONTAINER_TRANSFER = 10016;  // 容器间对象移动

  // 英雄 10020~10029
  ROUTE_CODE_HERO_LIST = 10020; // 英雄列表
  ROUTE_CODE_HERO_NOTIFY = 10021; // 英雄变化通知
  ROUTE_CODE_HERO_ADD = 10022; // 新增英雄(预发布和生成环境不开放)
  ROUTE_CODE_HERO_UPDATE = 10023; // 更新英雄(预发布和生成环境不开放)

  // 武器 10030~10039
  ROUTE_CODE_WEAPON_LIST = 10030; // 武器列表
  ROUTE_CODE_WEAPON_NOTIFY = 10031; // 武器变化通知
  ROUTE_CODE_WEAPON_ADD = 10032; // 新增武器(预发布和生成环境不开放)
  ROUTE_CODE_WEAPON_UPDATE = 10033; // 更新武器(预发布和生成环境不开放)

  // 技能 10040~10049
  ROUTE_CODE_SKILL_LIST = 10040; // 技能列表
  ROUTE_CODE_SKILL_NOTIFY = 10041; // 技能变化通知
  ROUTE_CODE_SKILL_ADD = 10042; // 新增技能(预发布和生成环境不开放)
  ROUTE_CODE_SKILL_UPDATE = 10043; // 更新技能(预发布和生成环境不开放)

  // 装备 10050~10059
  ROUTE_CODE_EQUIP_LIST = 10050; // 装备列表
  ROUTE_CODE_EQUIP_NOTIFY = 10051; // 装备变化通知
  ROUTE_CODE_EQUIP_ADD = 10052; // 新增装备(预发布和生成环境不开放)
  ROUTE_CODE_EQUIP_UPDATE = 10053; // 更新装备(预发布和生成环境不开放)

  // 战斗服 50000~59999

  // 社交服 60000~69999
}

//  ========== 业务错误码枚举（1000~9999） ==========
enum ErrCode {
  ERR_CODE_OK = 0;    // 成功
  ERR_CODE_INTERNAL_ERROR = 1000;
  ERR_CODE_INVALID_PARAMS = 1001;
  ERR_CODE_UNAUTHORIZED = 1002;
  ERR_CODE_PLAYER_NOT_FOUND = 2000;
  ERR_CODE_PLAYER_EXISTS = 2001;
  ERR_CODE_PASSWORD_WRONG = 2002;
  ERR_CODE_TOKEN_INVALID = 2003;
}

//  ========== 通知类型 ==========
enum NOTIFY_TYPE {
  NOTIFY_TYPE_KICK = 0; // 踢下线
  NOTIFY_TYPE_MAINTAIN = 2; // 维护
  NOTIFY_TYPE_BROADCAST = 3; // 公告
}

// ========== 容器类型枚举 ==========

enum ContainerType {
  CONTAINER_TYPE_UNSPECIFIED = 0;
  CONTAINER_TYPE_BACKPACK = 1; // 背包（局内随身，死亡掉落）
  CONTAINER_TYPE_STASH = 2;    // 仓库（局外固定，不掉落）
  CONTAINER_TYPE_SECURE = 3;   // 保险箱（局内随身，不掉落）
}

//  ========== 属性枚举 ==========
enum MagicAttr {
  // 0~10000 玩家相关属性
  PLAYER_ATTR_UNSPECIFIED = 0;
  PLAYER_ATTR_NAME = 1; // 昵称
  PLAYER_ATTR_LEVEL = 2; // 等级
  PLAYER_ATTR_EXP = 3; // 经验
  PLAYER_ATTR_VIP_LEVEL = 4; // vip等级
  PLAYER_ATTR_VIP_EXP = 5; // vip经验
  PLAYER_ATTR_COIN = 6; // 币
  PLAYER_ATTR_GOLD = 7; // 金
  // 10001~20000 红点相关属性
}

// 通用业务结果：每个响应包统一携带。
// code 用于客户端逻辑分支；msg 为空时按 code 取默认文案；args 为可变参数，
message Result {
  ErrCode code = 1;         // 业务错误码，ERR_CODE_OK 表示成功
  string msg = 2;           // 错误描述（服务端可覆盖默认文案）
  repeated string args = 3; // 可变参数
}

// 通用对象：等价于 JSON object，键为字段名，值为动态类型。
message Object {
  map<string, ObjectValue> values = 1; // 映射
}

// 动态值数组。
message ObjectList {
  repeated ObjectValue values = 1; // 列表
}

// 动态值：oneof 通用基本类型。
message ObjectValue {
  oneof kind {
    bool bool_value = 1;     // 布尔
    int32 int_value = 2;     // 整数
    int64 Bigint_value = 3;  // 整数
    double double_value = 4; // 浮点数
    string string_value = 5; // 字符串
  }
}

// 容器中的物品
message ItemEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 count = 3;       // 堆叠数量
  int32 grid_x = 4;      // 网格 X
  int32 grid_y = 5;      // 网格 Y
  bool rotated = 6;      // 是否旋转
}

// 容器条目
message ContainerEntry {
  int64 id = 1;              // 容器实例ID（=playerID + type 编码）
  ContainerType type = 2;              // 容器类型
  int32 grid_w = 3;                    // 网格宽度
  int32 grid_h = 4;                    // 网格高度
  int32 version = 5;                   // 操作版本号（每次修改+1）
  repeated ItemEntry item_entries = 6; // 物品列表
}

// 英雄持有（仅状态，静态属性由 hero_id 关联英雄配置表）
message HeroEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 level = 3;     // 等级
  int64 exp = 4;       // 经验
  int32 star = 5;      // 星级
  int32 skin_id = 6;   // 皮肤ID
  bool equipped = 7;   // 是否出战
}

// 武器持有（仅状态，静态属性由 weapon_id 关联武器配置表）
message WeaponEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 level = 3;       // 等级
  int32 durability = 4;  // 耐久度
  bool equipped = 5;     // 是否装备
}

// 技能持有（仅状态，静态属性由 skill_id 关联技能配置表）
message SkillEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 level = 3;    // 等级
  bool equipped = 4;  // 是否装备
}

// 装备持有（仅状态，静态属性由 equip_id 关联装备配置表）
message EquipEntry {
  int64 id = 1;     // 实例ID
  int32 cfg_id = 2; // 配置ID
  int32 level = 3;    // 等级
  bool equipped = 4;  // 是否穿戴
}
