syntax = "proto3";

package pb;

import "common.proto";
import "hero.proto";

option go_package = "server-cluster/share/pb";

// 更新技能请求（路由 10043）
message SkillUpdateReq {
  int32 cfg_id = 1;       // 技能配置ID
  int32 level = 2;        // 等级
  int32 quality = 3;      // 品质
  int32 breakthrough = 4; // 突破
}

// 更新技能响应
message SkillUpdateResp {
  Result result = 1;
  SkillEntry skill_entry = 2; // 更新后的持有状态
}

// 技能升级请求（路由 10044，消耗升级素材）
message SkillUpgradeReq {
  int32 cfg_id = 1; // 技能配置ID
}

// 技能升级响应
message SkillUpgradeResp {
  Result result = 1;
  SkillEntry skill_entry = 2;   // 升级后的持有状态
  HeroAttribute attribute = 3; // 升级后的英雄累计属性
}

// 技能升品请求（路由 10045，消耗升品素材）
message SkillUpQualityReq {
  int32 cfg_id = 1; // 技能配置ID
}

// 技能升品响应
message SkillUpQualityResp {
  Result result = 1;
  SkillEntry skill_entry = 2; // 升品后的持有状态
  HeroAttribute attribute = 3; // 升品后的英雄累计属性
}

// 技能突破请求（路由 10046，消耗突破素材）
message SkillBreakthroughReq {
  int32 cfg_id = 1; // 技能配置ID
}

// 技能突破响应
message SkillBreakthroughResp {
  Result result = 1;
  SkillEntry skill_entry = 2; // 突破后的持有状态
  HeroAttribute attribute = 3; // 突破后的英雄累计属性
}
