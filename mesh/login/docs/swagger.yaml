basePath: /
definitions:
  dto.PlayerBindReq:
    properties:
      appleIdentityToken:
        type: string
      appleNonce:
        type: string
      authType:
        description: 1账号 2手机 3微信 4Apple
        type: integer
      password:
        type: string
      phoneNumber:
        type: string
      playerId:
        type: integer
      smsCode:
        type: string
      username:
        type: string
      wechatCode:
        type: string
    type: object
  dto.PlayerLoginReq:
    properties:
      appleIdentityToken:
        description: APPLE(4)
        type: string
      appleNonce:
        description: 登录时传给 Apple 的原始 nonce，防止重放
        type: string
      deviceId:
        description: |-
          GUEST(0)
          所有类型通用：客户端生成的 UUIDv4 设备 ID
        type: string
      loginType:
        description: 必填，0~4
        type: integer
      password:
        type: string
      phoneNumber:
        description: 手机号
        type: string
      smsCode:
        description: 6 位验证码
        type: string
      username:
        description: ACCOUNT(1)
        type: string
      wechatCode:
        description: WECHAT(3)
        type: string
      zone:
        description: PHONE_SMS(2)
        type: integer
    type: object
  dto.PlayerLoginResp:
    properties:
      gateAddr:
        description: 网关连接地址，如 "drpc://xxx:yyy"
        type: string
      isNewPlayer:
        description: 是否本次新建（客户端决定是否弹新手引导）
        type: boolean
      token:
        description: JWT，payload 只有 player_id 字符串
        type: string
    type: object
  dto.PlayerPhoneSendCodeReq:
    properties:
      phoneNumber:
        description: 带区号，如 "+8613800138000"
        type: string
    type: object
host: 188.18.23.72:7788
info:
  contact: {}
  description: 账号注册，登录。
  title: 登录服 API
  version: "1.0"
paths:
  /api/v1/player/bind:
    post:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PlayerBindReq'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema: {}
      summary: 绑定凭据
      tags:
      - player
  /api/v1/player/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PlayerLoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.PlayerLoginResp'
      summary: 登录
      tags:
      - player
  /api/v1/player/phone/send-code:
    post:
      consumes:
      - application/json
      parameters:
      - description: 参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.PlayerPhoneSendCodeReq'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema: {}
      summary: 发送短信验证码
      tags:
      - player
swagger: "2.0"
