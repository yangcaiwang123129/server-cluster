basePath: /
definitions:
  dto.LoginReq:
    properties:
      loginType:
        description: 登录类型 0账号登录 1手机号登录 2微信授权登录
        type: integer
      password:
        type: string
      phoneNumber:
        type: string
      username:
        type: string
    type: object
  dto.LoginResp:
    properties:
      gateAddr:
        type: string
      token:
        type: string
    type: object
  dto.RegisterReq:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  dto.RegisterResp:
    properties:
      gateAddr:
        type: string
      token:
        type: string
    type: object
host: 188.18.23.72:8080
info:
  contact: {}
  description: 账号注册、登录与区服列表；token 供 game 服验签进入游戏。
  title: 登录服 API
  version: "1.0"
paths:
  /api/v1/account/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.LoginResp'
      summary: 登录账号
      tags:
      - account
  /api/v1/account/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.RegisterResp'
      summary: 注册账号
      tags:
      - account
