basePath: /api/v1
definitions:
  dto.LoginReq:
    properties:
      password:
        type: string
      username:
        type: string
    required:
    - password
    - username
    type: object
  dto.LoginResp:
    properties:
      expired_at:
        type: integer
      servers:
        items:
          $ref: '#/definitions/dto.ServerItem'
        type: array
      token:
        type: string
      uid:
        type: integer
    type: object
  dto.RegisterReq:
    properties:
      password:
        maxLength: 64
        minLength: 6
        type: string
      username:
        maxLength: 32
        minLength: 3
        type: string
    required:
    - password
    - username
    type: object
  dto.RegisterResp:
    properties:
      uid:
        type: integer
      username:
        type: string
    type: object
  dto.ServerItem:
    properties:
      gate_addr:
        description: WebSocket 接入地址，如 ws://127.0.0.1:3553
        type: string
      name:
        type: string
      server_id:
        type: integer
      status:
        description: 0 维护 1 流畅 2 火爆 3 新服
        type: integer
    type: object
  dto.ServerListResp:
    properties:
      servers:
        items:
          $ref: '#/definitions/dto.ServerItem'
        type: array
    type: object
host: localhost:8080
info:
  contact: {}
  description: 账号注册、登录与区服列表；token 供 game 服验签进入游戏。
  title: 登录服 API
  version: "1.0"
paths:
  /api/v1/account/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: 登录参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.LoginReq'
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.LoginResp'
      summary: 登录账号
      tags:
      - account
  /api/v1/account/register:
    post:
      consumes:
      - application/json
      parameters:
      - description: 注册参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dto.RegisterReq'
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.RegisterResp'
      summary: 注册账号
      tags:
      - account
  /api/v1/account/servers:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: 响应包在 {code, message, data} 中
          schema:
            $ref: '#/definitions/dto.ServerListResp'
      summary: 拉取区服列表
      tags:
      - account
swagger: "2.0"
