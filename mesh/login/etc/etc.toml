# 登录服（mesh 集群）配置
# due 自动加载 ./etc/etc.toml；键首段固定为 etc。

pid = "./run/login.pid"
mode = "debug"
timezone = "Local"

[cluster.mesh]
    # 实例ID，网格集群中唯一。不填写默认自动生成
    id = "login-1"
    # 实例名称
    name = "login"
    # 编解码器。可选：json | proto
    codec = "json"
    # RPC调用超时时间
    timeout = "3s"

[log]
    file = "./log/due.log"
    level = "info"
    format = "text"
    stdout = true
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    fileMaxAge = "7d"
    fileMaxSize = 100
    fileCutRule = "day"
    callerFullPath = true
    classifiedStorage = false

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000
    heartbeatTime = true

[registry.etcd]
    addrs = ["127.0.0.1:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["127.0.0.1:6379"]
    db = 0
    username = ""
    password = "root123"
    maxRetries = 3
    prefix = "due:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.client]
    certFile = ""
    serverName = ""

# HTTP 监听地址（due http 组件）
[http]
    addr = ":8080"

# Swagger 文档（由 swag 生成，due http 组件自动挂载到 /swagger）
[http.swagger]
    enable = true
    title = "登录服 API"
    filePath = "app/web/docs/swagger.json"
    basePath = "/swagger"

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例，启动后接口返回内部错误）
[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(127.0.0.1:3306)/account?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["127.0.0.1:6379"]
    username = ""
    password = "root123"
    db = 0

# JWT 配置：game 服验签需使用相同 secret
[jwt]
    secret = "mygame-secret"
    valid_duration = 7200 # 秒

# 区服列表：登录与区服接口共同返回
[[login.servers]]
    server_id = 1
    name = "一区·王者"
    gate_addr = "ws://127.0.0.1:3553"
    status = 1 # 0 维护 1 流畅 2 火爆 3 新服
