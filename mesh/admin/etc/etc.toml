# 管理后台服（纯 HTTP 服务）配置
# due 自动加载 ./etc/etc.toml；键首段固定为 etc。

pid = "./run/admin.pid"
mode = "debug"
timezone = "Local"

[log]
    file = "./log/due.log"
    level = "info"
    format = "text"
    stdout = true
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    fileMaxAge = "7d"
    fileMaxSize = 100
    fileCutRule = "day"
    callerFullPath = true
    classifiedStorage = false

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000
    heartbeatTime = true

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

# HTTP 监听地址（due http 组件）
[http]
    addr = ":8081"

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例）
[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(127.0.0.1:3306)/account?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["127.0.0.1:6379"]
    username = ""
    password = "root123"
    db = 0

# JWT 配置：与 login 服 secret 保持一致
[jwt]
    secret = "mygame-secret"
    valid_duration = 7200 # 秒
