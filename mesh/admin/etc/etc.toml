# 管理后台服（纯 HTTP 服务）配置
# due 自动加载 ./etc/etc.toml。

pid = "../../pid/admin.pid"
mode = "debug"
timezone = "Local"

[cluster.mesh]
    # 实例ID，网格集群中唯一。不填写默认自动生成
    id = "admin-1"
    # 实例名称
    name = "admin"
    # 编解码器。可选：json | proto
    codec = "json"
    [cluster.mesh.linker]
        # RPC调用超时时间
        callTimeout = "3s"

# HTTP 监听地址（due http 组件）
[http]
    addr = "188.18.23.72:8081"

# Swagger 文档（由 swag 生成，due http 组件自动挂载到 /swagger）
[http.swagger]
    enable = true
    title = "管理后台 API"
    filePath = "docs/swagger.json"
    basePath = "/swagger"

[log]
    level = "info"
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    [log.file]
        path = "../../log/admin.log"
        format = "text"
        maxAge = "7d"
        maxSize = 100
        rotate = "day"
    callFullPath = true

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000
    heartbeatTime = true

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例）
[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(127.0.0.1:3306)/game?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["127.0.0.1:6379"]
    username = ""
    password = "root123"
    db = 0

# JWT 配置：与 login 服 secret 保持一致
[jwt]
    secret = "cluster-secret"
    valid_duration = 7200 # 秒
