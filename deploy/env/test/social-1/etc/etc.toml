# 社交逻辑服（test / social-1）。

pid = "../../pid/social-1.pid"
mode = "debug"
timezone = "Asia/Shanghai"

[cluster.node]
    id = "social-1"
    name = "social"
    addr = "172.16.0.12:"
    codec = "proto"
    [cluster.node.linker]
        callTimeout = "3s"

[log]
    level = "info"
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    callFullPath = true
    [log.file]
        path = "../../log/social-1.log"
        format = "text"
        maxAge = "7d"
        maxSize = 100
        rotate = "day"

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000

[registry.etcd]
    addrs = ["172.16.0.2:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["172.16.0.2:6379"]
    db = 2
    username = ""
    password = "root123"
    maxRetries = 3
    prefix = "cluster:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.server]
    addr = "172.16.0.12:"

[transport.grpc.client]
    caFile = ""
    serverName = ""

[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(172.16.0.2:3306)/game?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

[[redis.instances]]
    name = "default"
    addrs = ["172.16.0.2:6379"]
    username = ""
    password = "root123"
    db = 2
