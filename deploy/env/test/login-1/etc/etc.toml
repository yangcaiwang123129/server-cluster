# 登录服（mesh 集群）配置
# due 自动加载 ./etc/etc.toml。

pid = "../../pid/login-1.pid"
mode = "debug"
timezone = "Local"

[cluster.mesh]
    # 实例ID，网格集群中唯一。不填写默认自动生成
    id = "login-1"
    # 实例名称
    name = "login"
    # 编解码器。可选：json | proto
    codec = "json"
    [cluster.mesh.linker]
        # RPC调用超时时间
        callTimeout = "3s"
# HTTP 监听地址（due http 组件）
[http]
    addr = "106.53.0.18:7788"

# CORS 跨域（开发环境全放行）
[http.cors]
    enable = true
    allowOrigins = []
    allowMethods = ["GET", "POST", "HEAD", "PUT", "DELETE", "PATCH", "OPTIONS"]
    allowHeaders = []
    allowCredentials = false
    exposeHeaders = []
    maxAge = 86400
[log]
    level = "info"
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    [log.file]
        path = "../../log/login-1.log"
        format = "text"
        maxAge = "7d"
        maxSize = 100
        rotate = "day"
    callFullPath = true

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000
    heartbeatTime = true

[registry.etcd]
    addrs = ["172.16.0.2:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["172.16.0.2:6379"]
    db = 0
    username = ""
    password = "root123"
    maxRetries = 3
    prefix = "cluster:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.client]
    caFile = ""
    serverName = ""

# Swagger 文档（由 swag 生成，due http 组件自动挂载到 /swagger）
[http.swagger]
    enable = true
    title = "登录服 API"
    filePath = "docs/swagger.json"
    basePath = "/swagger"

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例，启动后接口返回内部错误）
[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(172.16.0.2:3306)/game?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["172.16.0.2:6379"]
    username = ""
    password = "root123"
    db = 0

# JWT 配置：game 服验签需使用相同 secret
[jwt]
    secret = "cluster-secret"
    valid_duration = 7200 # 秒

# 网关地址：登录成功后下发给客户端连接（必须与 gate 的 network.ws.server.addr 一致）
[gate]
    addr = "106.53.0.18:9000"