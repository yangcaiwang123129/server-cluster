# 战斗逻辑服（test / battle-1，自带网关组件）。

pid = "../../pid/battle-1.pid"
mode = "debug"
timezone = "Asia/Shanghai"

[cluster.node]
    id = "battle-1"
    name = "battle"
    addr = "172.16.0.2:"
    codec = "proto"
    [cluster.node.linker]
        callTimeout = "3s"

[cluster.gate]
    id = "battle-gate-1"
    name = "gate"
    addr = "172.16.0.2:"
    [cluster.gate.linker]
        callTimeout = "3s"

[log]
    level = "info"
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    callFullPath = true
    [log.file]
        path = "../../log/battle-1.log"
        format = "text"
        maxAge = "7d"
        maxSize = 100
        rotate = "day"

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000

[registry.etcd]
    addrs = ["172.16.0.2:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["172.16.0.2:6379"]
    db = 2
    username = ""
    password = "root123"
    maxRetries = 3
    prefix = "cluster:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.server]
    addr = "172.16.0.12:"

[transport.grpc.client]
    caFile = ""
    serverName = ""

[network.ws.server]
    addr = "106.53.0.18:9010"
    path = "/"
    maxConnNum = 5000
    origins = ["*"]
    heartbeatInterval = "10s"
    heartbeatMechanism = "resp"

[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(172.16.0.2:3306)/game?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

[[redis.instances]]
    name = "default"
    addrs = ["172.16.0.2:6379"]
    username = ""
    password = "root123"
    db = 2
