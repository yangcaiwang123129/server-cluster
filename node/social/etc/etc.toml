# 社交逻辑服（node 集群）配置
# due 自动加载 ./etc/etc.toml。

pid = "../../pid/social.pid"
mode = "debug"
timezone = "Local"

[cluster.node]
    id = "social-1"
    name = "social"
    addr = "127.0.0.1:"
    codec = "proto"
    [cluster.node.linker]
        callTimeout = "3s"

[log]
    level = "info"
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    [log.file]
        path = "../../log/social.log"
        format = "text"
        maxAge = "7d"
        maxSize = 100
        rotate = "day"
    callFullPath = true

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000

[registry.etcd]
    addrs = ["127.0.0.1:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["127.0.0.1:6379"]
    db = 0
    username = ""
    password = "root123"
    maxRetries = 3
    prefix = "cluster:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.client]
    caFile = ""
    serverName = ""

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例，模板可无 MySQL 启动）
[[db.mysql.instances]]
    name = "default"
    dsn = "root:root123@tcp(127.0.0.1:3306)/game?charset=utf8mb4&parseTime=True&loc=Local&timeout=5s&readTimeout=10s&writeTimeout=10s"
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["127.0.0.1:6379"]
    username = ""
    password = "root123"
    db = 0
