# 战斗逻辑服（node 集群）配置
# due 自动加载 ./etc/etc.toml；键首段固定为 etc。

pid = "./run/battle.pid"
mode = "debug"
timezone = "Local"

[cluster.node]
    id = "battle-1"
    name = "battle"
    addr = ":0"
    codec = "json"
    timeout = "3s"

[log]
    file = "./log/due.log"
    level = "info"
    format = "text"
    stdout = true
    timeFormat = "2006/01/02 15:04:05.000000"
    stackLevel = "error"
    fileMaxAge = "7d"
    fileMaxSize = 100
    fileCutRule = "day"
    callerFullPath = true
    classifiedStorage = false

[packet]
    byteOrder = "big"
    routeBytes = 4
    seqBytes = 4
    bufferBytes = 5000

[registry.etcd]
    addrs = ["127.0.0.1:2379"]
    namespace = "services"

[locate.redis]
    addrs = ["127.0.0.1:6379"]
    db = 0
    username = ""
    password = ""
    maxRetries = 3
    prefix = "due:locate"

[task]
    size = 1000
    nonblocking = true
    disablePurge = true

[transport.grpc.client]
    certFile = ""
    serverName = ""

# MySQL 命名实例（多数据源；dsn 为空则跳过该实例，模板可无 MySQL 启动）
[[db.mysql.instances]]
    name = "default"
    dsn = ""
    max_open_conns = 50
    max_idle_conns = 20

# Redis 命名实例（不同业务可按 name 使用不同 db 号）
[[redis.instances]]
    name = "default"
    addrs = ["127.0.0.1:6379"]
    username = ""
    password = ""
    db = 0
